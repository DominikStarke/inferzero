# A release built and published on GitHub's runners (2026-11-24: since then the laptop builds nothing, the user's
# rule, so the packages that scripts/make-package.ps1 / make-package-linux.sh made there are made here). Started by
# hand, after the release's tag is pushed on the commit to release (git tag N <commit> && git push origin N):
# `gh workflow run release.yml --ref main -f release=N -f notes_file=...`; the release is made on that tag.
# The packages are those of the scripts, as before: the Windows zip from the same build.ps1 and MSVC, the Linux
# tar.gz on the oldest Ubuntu it is for (24.04), as ci.yml's linux-package job. No GPU here: what is checked is that
# they build and start; the GPU checks stay with the release's notes on users' cards.
name: release
on:
  workflow_dispatch:
    inputs:
      release:
        description: "The release's number, yyyy.MM.dd.NN (two digits for NN)"
        required: true
      notes_file:
        description: "A Markdown file in the repository with the release's notes (empty: CHANGELOG.md's first section)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and package
        shell: powershell
        env:
          REL: ${{ inputs.release }}  # (through env, not pasted into the script; checked before use)
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REL -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d{2}$') { throw "release: yyyy.MM.dd.NN (got $env:REL)" }
          powershell -ExecutionPolicy Bypass -File scripts\make-package.ps1 -Release $env:REL
          if (-not $?) { throw "make-package failed" }
          Get-ChildItem dist\*.zip
      - name: The programs start
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $z = Get-ChildItem dist\*.zip | Select-Object -First 1
          Expand-Archive $z.FullName -DestinationPath dist\check
          $pkg = Get-ChildItem dist\check -Directory | Select-Object -First 1
          & (Join-Path $pkg.FullName "bin\serverz.exe") --help | Select-Object -First 3
          # (runz prints its usage on stderr: read through cmd, so PowerShell's Stop does not take it as an error)
          $u = cmd /c "`"$(Join-Path $pkg.FullName 'bin\runz.exe')`" --help 2>&1"
          $u | Select-Object -First 3
          if (-not (($u -join "`n") -match 'usage: runz')) { throw "runz did not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: dist/*.zip
          retention-days: 7
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and package
        shell: bash
        env:
          REL: ${{ inputs.release }}
        run: |
          set -e
          [[ "$REL" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]] || { echo "release: yyyy.MM.dd.NN (got $REL)" >&2; exit 2; }
          bash scripts/make-package-linux.sh --release "$REL"
          pkg=$(ls -d dist/inferzero-*-linux-x64 | head -1)
          # (into a file, then head: under pipefail a head that closes early can end the step with 141)
          "$pkg/bin/serverz" --help > /tmp/serverz_help.txt; head -3 /tmp/serverz_help.txt
          "$pkg/bin/runz" --help > /tmp/runz_help.txt 2>&1 || true; head -3 /tmp/runz_help.txt
          grep -q "usage: runz" /tmp/runz_help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz
          retention-days: 7
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: The release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release }}
          NOTES: ${{ inputs.notes_file }}
        run: |
          set -e
          rel="$REL"
          notes="$NOTES"
          [[ "$rel" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]] || { echo "release: yyyy.MM.dd.NN (got $rel)" >&2; exit 2; }
          if [ -n "$notes" ] && [ ! -f "$notes" ]; then echo "no notes file $notes" >&2; exit 2; fi
          if [ -z "$notes" ]; then  # (CHANGELOG.md's first section: from its first '## ' line to the next)
            awk 'BEGIN{n=0} /^## /{n++; if(n==2) exit} n==1' CHANGELOG.md > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          # (the tag first, pushed with the user's own git: the workflow's token may not create a ref on a commit that
          #  changes a workflow file, the HTTP 403 of 2026.11.24.03. It must name the dispatched commit)
          tagsha=$(git ls-remote origin "refs/tags/$rel^{}" | cut -f1)
          [ -n "$tagsha" ] || tagsha=$(git ls-remote origin "refs/tags/$rel" | cut -f1)
          [ -n "$tagsha" ] || { echo "no tag $rel: push it first (git tag $rel <commit> && git push origin $rel)" >&2; exit 2; }
          [ "$tagsha" = "$GITHUB_SHA" ] || { echo "tag $rel is $tagsha, the run is at $GITHUB_SHA" >&2; exit 2; }
          gh release create "$rel" out/win64/*.zip out/linux-x64/*.tar.gz --title "$rel" --notes-file "$notes" --verify-tag
